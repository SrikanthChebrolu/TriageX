<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Navy rounded square background -->
  <rect width="32" height="32" rx="7" fill="#003366"/>
  <!-- Teal accent bar (left edge, like the nav sidebar) -->
  <rect x="0" y="0" width="4" height="32" rx="2" fill="#0099b8"/>
  <!-- "T" stroke -->
  <line x1="9" y1="10" x2="19" y2="10" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="14" y1="10" x2="14" y2="22" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <!-- "X" stroke -->
  <line x1="20" y1="10" x2="28" y2="22" stroke="#0099b8" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="28" y1="10" x2="20" y2="22" stroke="#0099b8" stroke-width="2.2" stroke-linecap="round"/>
</svg>
